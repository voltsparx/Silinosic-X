name: Silinosic-X Pages

on:
  push:
    branches:
      - main
      - master
      - gh-pages
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # FIX: Changed from 'docs/website' to 'website' to match your path trigger
          path: website 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
