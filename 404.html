<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found | Silinosic-X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="web_assets/media/silinosic-x-favicon.ico" sizes="any">
<style>
  :root { color-scheme: dark; --bg:#081018; --text:#f5f8fc; --muted:#98a8bd; --accent:#ff8a1d; --accent2:#ffb259; --line:rgba(255,176,90,.18); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; color:var(--text);
    font-family:"Sora",system-ui,sans-serif;
    background: radial-gradient(circle at 18% 8%, rgba(255,138,29,.16), transparent 30%), radial-gradient(circle at 84% 14%, rgba(115,212,255,.09), transparent 28%), var(--bg); }
  .panel { width:min(640px,100%); padding:2.2rem; border:1px solid var(--line); border-radius:24px; background:rgba(9,16,24,.92); box-shadow:0 22px 70px rgba(0,0,0,.4); }
  .logo { display:flex; align-items:center; gap:.75rem; font-weight:700; }
  .logo img { width:38px; height:38px; border-radius:10px; border:1px solid var(--line); }
  .code { margin:1.6rem 0 .2rem; font:600 .75rem "IBM Plex Mono",monospace; letter-spacing:.2em; color:var(--accent2); }
  h1 { margin:.2rem 0 .8rem; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.04em; line-height:1.1; }
  p { color:var(--muted); line-height:1.7; margin:.5rem 0; }
  .links { display:flex; flex-wrap:wrap; gap:.7rem; margin-top:1.6rem; }
  a.btn { padding:.75rem 1.1rem; border-radius:999px; border:1px solid var(--line); color:var(--text); text-decoration:none; font-weight:600; transition:transform .16s ease,border-color .16s ease; }
  a.btn:hover, a.btn:focus-visible { transform:translateY(-2px); border-color:var(--accent2); outline:none; }
  a.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#120a04; border-color:transparent; }
</style>
</head>
<body>
  <main class="panel">
    <div class="logo"><img src="web_assets/media/silinosic-x-web.png" alt=""> Silinosic-X</div>
    <div class="code">ERROR / 404</div>
    <h1>That page was not found.</h1>
    <p>The link may be outdated, or GitHub Pages may still be publishing the latest build.</p>
    <div class="links">
      <a class="btn primary" href="./index.html">Docs home</a>
      <a class="btn" href="./getting-started.html">Getting started</a>
      <a class="btn" href="./cli-reference.html">CLI reference</a>
    </div>
  </main>
</body>
</html>
